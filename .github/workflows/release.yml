name: Release

# Build macOS and Windows packages on every version tag (e.g. v1.0.0), then publish
# artifacts on the GitHub Release (dmg/zip/latest-mac.yml + NSIS/zip/latest.yml).
# Upstream mirrors those files at https://nodeterm.dev/updates; forks without that
# mirror skip the post-promote feed check (see verify-feed).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allow creating the GitHub Release (canonical artifact store)

jobs:
  release-mac:
    # GitHub-hosted Apple Silicon (unsigned on forks without CSC / notarization secrets).
    # Upstream may still use a self-hosted runner with signing — this fork uses hosted runners only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The free-tier project limit's embedded deadline (PROJECT_LIMIT_DEADLINE_MS) must be bumped
      # in every release before the flip, or DO_NOT_TRACK users are gated before anyone else. This
      # refuses a tag whose deadline is under 30 days away (until it is frozen at the flip). Plain
      # node, no npm ci, so a refused release fails in seconds. It is the FIRST step that runs in
      # every build job (mac, win): those jobs do not wait for each other and each creates
      # the release on its first upload, so a refused tag must stop all three before they build.
      # See docs/project-limit.md.
      - name: Project-limit deadline guard
        run: node scripts/check-project-limit-deadline.mjs

      - name: Install dependencies
        run: npm ci

      # The bundled tmux (resources/bin/tmux → <app>/Contents/Resources/bin/tmux via the mac
      # extraResources entry). Without a tmux on the machine the app silently degrades to plain
      # shells — no persistence across restarts, no mobile attach, and a park/dispose kills the
      # agent CLI instead of detaching a client (issue #126). Shipping one removes that for the
      # tmux-less; the SYSTEM tmux still takes precedence at runtime (see findTmux).
      #
      # A SEPARATE STEP, before electron-builder, on purpose: a missing extraResources source is
      # only a WARNING to electron-builder, so a failure folded into the release command could
      # publish a DMG with no tmux in it and nobody would notice. Here a build failure fails the
      # job. Idempotent — a rerun with the binary already present is a no-op.
      #
      # RUNNER TOOLCHAIN: the Xcode command line tools and nothing else — curl, cc, make, ar, yacc,
      # lipo, strip, otool, nm. Explicitly NOT needed: cmake, autoconf, pkg-config, Homebrew,
      # Rosetta (the cross slice is configured with --host), npm packages (node stdlib only).
      - name: Build bundled tmux (universal, static libevent + utf8proc)
        run: node scripts/build-tmux.mjs

      # Unsigned macOS release (arm64 + x64): same electron-builder flags as local `npm run dist`,
      # plus both arches and nodeTermUpdates=manual — passive update notice only until signing exists.
      # No CSC_* / APPLE_* secrets on this fork.
      #
      # electron-vite's renderer bundle (Monaco, Excalidraw, xterm, …) needs more than the ~2 GiB
      # default old-space cap on GitHub-hosted macOS runners — without this the client build OOMs.
      - name: Build macOS packages (DMG + zip, unsigned)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run dist:mac:release

      - name: Verify expected artifacts
        run: |
          ls -la dist
          version=$(node -p "require('./package.json').version")
          test -f dist/latest-mac.yml || { echo "::error::latest-mac.yml (update notice feed) missing"; exit 1; }
          ls dist/*.dmg >/dev/null 2>&1 || { echo "::error::mac DMG missing"; exit 1; }
          ls dist/*-mac.zip >/dev/null 2>&1 || { echo "::error::mac zip missing"; exit 1; }

      # NOTE: there is deliberately no actions/upload-artifact step. Each release is ~800 MB of
      # DMGs + zips, and Actions artifact storage is a small, billed quota. The GitHub Release
      # below is the canonical store — it does not consume that quota.

      # Canonical copy of every release on GitHub. The update feed itself may be mirrored at
      # nodeterm.dev (see verify-feed below), but keeping a GitHub Release means there is always
      # a downloadable, versioned backup.
      #
      # Shell + `gh release upload --clobber` instead of softprops: uploading large assets from a
      # runner can hit mid-upload network errors that softprops cannot retry. --clobber makes every
      # retry idempotent.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Another platform job may already have created the release for this tag; tolerate the race.
          # Created as PRERELEASE: a half-built release must never become "latest" (the site and
          # the update feed follow /releases/latest). The `publish` job flips it once the mac
          # job has uploaded.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --prerelease --notes "" || true
          n=1
          until gh release upload "$tag" dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap --clobber --repo "$GITHUB_REPOSITORY"; do
            if [ "$n" -ge 5 ]; then
              echo "::error::asset upload failed after $n attempts"
              exit 1
            fi
            echo "::warning::asset upload attempt $n failed (transient network?); retrying in 30s…"
            n=$((n + 1))
            sleep 30
          done

  # Windows build: UNSIGNED BETA (#454), on a plain GitHub runner. Publishes the NSIS
  # installer + zip + latest.yml as assets on the same tag's GitHub Release. latest.yml is a
  # PASSIVE notice feed only: `dist:win:release` stamps the package `nodeTermUpdates=manual`
  # (see src/shared/update-platform.ts), so the shipped app checks the feed and shows a
  # "new version available — Download" card linking the releases page, but never downloads or
  # installs (quitAndInstall is refused in main). Self-install arrives with code signing; an
  # unsigned auto-update is a trust downgrade. The nodeterm.dev/updates mirror must serve
  # latest.yml the way it serves latest-mac.yml (hosted outside this repo);
  # the `verify-feed` job below reports whether it does.
  #
  # BEST-EFFORT by design: the `publish` promote gate below deliberately does NOT wait on
  # this job, so a Windows failure never strands the mac release as a prerelease. A
  # failed run is rerun and uploads into the (possibly already published) release. Uploads
  # use `gh release upload --clobber` (never softprops) so a late finish can't flip an
  # already-promoted release back to prerelease by re-writing its fields.
  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Same guard as release-mac (see the comment there): first, so a refused tag uploads nothing.
      - name: Project-limit deadline guard
        run: node scripts/check-project-limit-deadline.mjs

      # postinstall patches node-pty and rebuilds node-pty + smart-whisper against Electron's
      # ABI — the same install win-package-smoke.yml and the quality-windows CI job prove green.
      - name: Install dependencies
        run: npm ci

      # make-icon + electron-vite build + electron-builder --win --x64 --publish never, stamped
      # nodeTermUpdates=manual (plain `dist:win` stays `disabled` for local packages that must
      # never poll). Unsigned: no signing secrets exist for Windows yet; SmartScreen will warn.
      - name: Build Windows packages (NSIS installer + zip, unsigned)
        run: npm run dist:win:release

      # The artifact names are the contract (same check as win-package-smoke.yml): a silent
      # target/artifactName regression must fail here, before the upload step lies about it.
      - name: Verify expected artifacts
        shell: bash
        run: |
          ls -la dist
          version=$(node -p "require('./package.json').version")
          test -f "dist/nodeterm-Setup-${version}.exe" || { echo "::error::NSIS installer missing"; exit 1; }
          ls dist/nodeterm-*-win.zip >/dev/null 2>&1 || { echo "::error::win zip missing"; exit 1; }
          test -f dist/latest.yml || { echo "::error::latest.yml (update notice feed) missing"; exit 1; }

      # Deliberately narrow globs: the installer + zip + latest.yml (the passive notice feed).
      # No *.blockmap: differential downloads belong to the self-install story that waits on
      # signing. The feed may briefly name this version before `publish` promotes it — harmless,
      # the card only links the releases page and never downloads a file.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Another platform job may already have created the release for this tag; tolerate
          # the race. Created as PRERELEASE for the same reason the mac job does it — a
          # half-built release must never become "latest"; the `publish` job flips it.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --prerelease --notes "" || true
          n=1
          until gh release upload "$tag" dist/nodeterm-Setup-*.exe dist/nodeterm-*-win.zip dist/latest.yml --clobber --repo "$GITHUB_REPOSITORY"; do
            if [ "$n" -ge 5 ]; then
              echo "::error::asset upload failed after $n attempts"
              exit 1
            fi
            echo "::warning::asset upload attempt $n failed (transient network?); retrying in 30s…"
            n=$((n + 1))
            sleep 30
          done

  # Flips the release to a published "latest" once the mac job uploaded its assets. Until then
  # it stays a prerelease, so /releases/latest (the site + update feeds) keeps serving the
  # previous complete release — a mac-runner sleep or an upload failure can no longer put a
  # partial release in front of users.
  # release-win is deliberately NOT in `needs`: the Windows asset is an unsigned beta whose feed
  # is a passive notice only, and its failure must never hold the mac release hostage.
  publish:
    runs-on: ubuntu-latest
    needs: [release-mac]
    # A job-level block replaces the workflow's, so contents: write is restated. issues: read lets
    # the release-notes generator look up the PRs labelled `no-release-notes` (labels live on the
    # issues API); without it that lookup fails and the notes fall back to the plain commit list.
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — notes diff against the previous release tag

      # Release notes, in two layers (issue #841). Written BEFORE the promote below, so the
      # release is complete — assets AND notes — the moment it becomes "latest".
      #
      #   Layer 1  scripts/release-notes.mjs asks GitHub's own generator for the PR-resolved
      #            list (PR number, PR title, author) and regroups it into New / Improved /
      #            Fixed, with test/refactor/chore/ci/build collapsed at the bottom — kept, not
      #            deleted. Every entry links its PR, and any issue its title names. A PR
      #            labelled `no-release-notes` is left out entirely (docs/release-notes/README.md).
      #   Layer 2  docs/release-notes/<TAG>.md, a hand-written Highlights block reviewed in the
      #            release PR, placed at the top. ABSENT FILE ⇒ THE GROUPED LIST ALONE. No
      #            release is ever blocked waiting for prose, and nobody has to be in the loop.
      #
      # DEGRADES, NEVER FAILS: if the generator throws for any reason (gh api down, a body
      # shape we do not parse, a missing node), the step falls back to the plain `git log` list
      # this release used to publish — or to the compare link alone when a `no-release-notes` PR
      # is in the range or the label lookup does not answer. A release that cannot publish
      # because prose generation broke would be strictly worse than the list we are replacing.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The range starts at the last release USERS ACTUALLY GOT, not at the last tag. A
          # platform job can fail — v0.3.8's mac job did, after the signing runner's OS upgrade —
          # and that tag then stays a prerelease forever: never promoted, its notes never
          # generated. Diffing the next release against it would publish a changelog containing
          # only the handful of commits since, silently burying everything the stranded tag was
          # carrying. /releases/latest excludes prereleases, which is exactly the question being
          # asked, and this step runs BEFORE the promote below, so it still names the PREVIOUS
          # release. Falls back to the last tag when there is no published release yet, and when
          # a rerun on an already-promoted tag would otherwise diff that tag against itself.
          # Do NOT append `|| true` to the gh call: a 404 still prints JSON to stdout and would
          # become previous_tag_name, which breaks generate-notes and git log ranges on a fork's
          # first published release.
          prev=""
          if latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null); then
            case "$latest" in v*) prev="$latest" ;; esac
          fi
          if [ -z "$prev" ] || [ "$prev" = "$tag" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
            case "$prev" in v*) ;; *) prev="" ;; esac
          fi
          if [ -n "$prev" ]; then range="${prev}..${tag}"; else range="${tag}"; fi
          notes_args=(node scripts/release-notes.mjs --tag "$tag" --repo "$GITHUB_REPOSITORY" --out notes.md)
          if [ -n "$prev" ]; then notes_args+=(--prev "$prev"); fi
          if ! "${notes_args[@]}"; then
            echo "::warning::structured release notes failed; falling back to the plain commit list"
            # The plain list is commit subjects, and git knows nothing about the `no-release-notes`
            # label — the fallback would publish exactly what the label keeps out. So the list is
            # printed only when the label lookup ANSWERS and no labelled PR was merged in this
            # range; otherwise the notes are the compare link alone. A failed lookup is not "no
            # labelled PRs".
            withheld=yes
            if labelled=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=no-release-notes&state=all&per_page=100" \
                            --jq '.[] | select(.pull_request) | .number' 2>/dev/null); then
              withheld=no
              subjects=$(git log --format='%s' "$range")
              for n in $labelled; do
                if grep -qE "^Merge pull request #${n} |\(#${n}\)\$" <<<"$subjects"; then withheld=yes; break; fi
              done
            fi
            if [ -n "$prev" ]; then link="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else link="https://github.com/${GITHUB_REPOSITORY}/commits/${tag}"; fi
            {
              echo "## Changes${prev:+ since ${prev}}"
              if [ "$withheld" = yes ]; then
                echo "Full list of changes: ${link}"
              else
                git log --no-merges --format='- %s' "$range" | grep -vE '^- chore\(release\)' | head -60
                total=$(git log --no-merges --format='- %s' "$range" | grep -cvE '^- chore\(release\)' || true)
                if [ "${total:-0}" -gt 60 ]; then echo "- …and $((total - 60)) more commits"; fi
              fi
            } > notes.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest

      # Homebrew: the cask is NOT updated from here. It lives in the official homebrew/cask,
      # whose autobump follows /releases/latest — which excludes prereleases, so it only ever
      # picks up a release this publish job has promoted. (nodeterm/homebrew-tap is retired.)

  # The update FEED is what installed apps actually read, and it is not the GitHub Release: the
  # apps poll https://nodeterm.dev/updates (package.json build.publish), a mirror hosted OUTSIDE
  # this repo. Nothing used to check it, which is how latest.yml 404'd there while every job here
  # was green — and a check-only Windows build reports a failed automatic check only in its log, so
  # the passive update notice was dead with no signal anywhere (U2). This job turns that hidden
  # dependency into a visible result, AFTER the release is already promoted: it never holds a
  # release back, a red run is the alarm.
  #
  # Forks that do not mirror releases to nodeterm.dev skip this job entirely (GitHub Release is
  # the canonical artifact store for them).
  #
  # STRICT files fail the job when the mirror does not serve this tag's version within the retry
  # window (mirror sync / CDN delay); ADVISORY files only warn. latest.yml is advisory until the
  # mirror is confirmed to serve it — move it to STRICT then. It is checked only when release-win
  # itself succeeded (that job is best-effort and may finish later or need a rerun).
  verify-feed:
    runs-on: ubuntu-latest
    needs: [publish, release-win]
    if: ${{ always() && needs.publish.result == 'success' && github.repository == 'eneskirca/nodeterm' }}
    steps:
      - name: Verify the update feed serves this release
        env:
          FEED: https://nodeterm.dev/updates
          STRICT: latest-mac.yml
          ADVISORY: latest.yml
          WIN_RESULT: ${{ needs.release-win.result }}
          # ~2.4× the 5 min lag measured on v0.4.4, and a cap on the JOB, not on each file.
          BUDGET_MINUTES: 12
          INTERVAL: 30
        run: |
          want="${GITHUB_REF_NAME#v}"
          # One deadline for every file, taken once up front — see the comment above the job.
          deadline=$(( $(date +%s) + ${BUDGET_MINUTES:-12} * 60 ))
          fail=0
          check() {
            f="$1"; level="$2"; got=""
            while :; do
              # `|| true` is load-bearing: GitHub runs this step under `bash -eo pipefail`, so a
              # mirror that 404s makes `curl -f` exit non-zero, pipefail hands that to the
              # assignment and `-e` kills the whole step on the FIRST attempt — no retry, no
              # ::error::, no ::warning::, exit 22 and an empty log. A MISSING file is the case this
              # job was written for (latest.yml 404'd on the mirror for v0.4.3) and the one the
              # '<missing>' default below was always meant to report; advisory also has to mean
              # advisory when the file is absent, not just when it is stale. It covers the EPIPE
              # from `head -n 1` closing the pipe early for the same reason.
              got=$(curl -fsSL --max-time 20 "$FEED/$f" 2>/dev/null \
                | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d "\"' \r" || true)
              if [ "$got" = "$want" ]; then
                echo "$FEED/$f serves $got"
                return 0
              fi
              # Every file gets at least one attempt, however little budget is left.
              left=$(( deadline - $(date +%s) ))
              if [ "$left" -le 0 ]; then break; fi
              echo "$FEED/$f serves '${got:-<missing>}', want $want; retrying in ${INTERVAL}s (${left}s of budget left)…"
              sleep "$INTERVAL"
            done
            echo "::$level::$FEED/$f serves version '${got:-<missing>}', expected $want"
            if [ "$level" = error ]; then fail=1; fi
          }
          for f in $STRICT; do check "$f" error; done
          if [ "$WIN_RESULT" = success ]; then
            for f in $ADVISORY; do check "$f" warning; done
          else
            echo "::warning::release-win result is '$WIN_RESULT'; latest.yml was not checked"
          fi
          exit "$fail"
